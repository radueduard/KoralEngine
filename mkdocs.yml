# The Koral Engine wiki: the guides in docs/, built into a site by MkDocs and published to GitHub Pages
# (.github/workflows/wiki.yml). Locally:
#
#   pip install -r docs/requirements.txt
#   mkdocs serve            # http://127.0.0.1:8000, rebuilt as a page is saved
#   mkdocs build --strict   # what the workflow does: a broken link fails it
site_name: Koral Engine
site_description: A graphics-programming engine on the Koral framework — an ECS, C# and Kotlin scripts, and render passes drawn in a node editor.
site_url: https://radueduard.github.io/KoralEngine/
repo_url: https://github.com/radueduard/KoralEngine
repo_name: radueduard/KoralEngine
edit_uri: edit/main/docs/
docs_dir: docs

# What is in docs/ for the repository's own sake, not the wiki's: the plan the engine was built by, and a research report.
exclude_docs: |
  requirements.txt
  plan.md
  node-survey.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: teal
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light }
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # The glossary page is GLOSSARY.md, at the repository's root, brought in whole.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Building the engine: getting-started/building.md
      - A first project: getting-started/first-project.md
      - Concepts: getting-started/concepts.md
  - Guides:
      - The editor: editor.md
      - The pass graph: kgraph.md
      - Scripts: scripts.md
      - The shader library: shaders.md
      - The ECS: kecs.md
      - A scene over a network: networking.md
  - Background:
      - Glossary: glossary.md
      - Design: design.md
      - Decisions:
          - The graph projects the framework: adr/0001-graph-projects-the-framework.md
          - Materials are data, shaders claim them: adr/0002-materials-are-data-shaders-claim-them.md
          - Assets are made by producers: adr/0003-assets-are-made-by-producers.md
  - Koral API: https://radueduard.github.io/Koral/
