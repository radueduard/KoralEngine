name: Wiki

# The guides in docs/, built into a site by MkDocs (mkdocs.yml) and published to GitHub Pages. Built on every push that
# changes them; published from main. A pull request's build only checks that it builds: a broken link fails it.
#
# The repository's Pages settings must say "GitHub Actions" as the source (Settings, Pages, Build and deployment).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'GLOSSARY.md'
      - 'mkdocs.yml'
      - 'tools/wiki/**'
      - '.github/workflows/wiki.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'GLOSSARY.md'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; one in progress is left to finish.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same guides, copied into the repository's GitHub wiki (its Wiki tab) by tools/wiki/mirror.py: a page a guide,
  # the nav its sidebar. The wiki is a copy, replaced whole each time; docs/ is what is edited.
  mirror:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 tools/wiki/mirror.py .wiki
      - name: Publish
        working-directory: .wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The wiki is as the guides are."; exit 0; fi
          git commit -m "The guides as of ${GITHUB_SHA::7}"
          git push

