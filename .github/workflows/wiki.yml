name: Wiki

# The guides in docs/, built into a site by MkDocs (mkdocs.yml) and published to GitHub Pages. Built on every push that
# changes them; published from main. A pull request's build only checks that it builds: a broken link fails it.
#
# The repository's Pages settings must say "GitHub Actions" as the source (Settings, Pages, Build and deployment).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'GLOSSARY.md'
      - 'mkdocs.yml'
      - '.github/workflows/wiki.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'GLOSSARY.md'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; one in progress is left to finish.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
